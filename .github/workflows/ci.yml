name: CI

# PHP CI matrix (Linux × PHP 8.2/8.3/8.4) + lint gates.
# Linux-only matrix at v1.0 (cross-OS deferred); enforces the quality gates:
# coverage ≥80%, no lifecycle scripts, network-disabled smoke test, and MIT
# license enforcement.
# Mirrors `location-php/.github/workflows/ci.yml` shape.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- PHP test matrix ---
  test:
    name: test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    # v1.1: add os: [ubuntu-latest, macos-latest, windows-latest] (cross-OS deferral)
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan (level 8)
        # Explicit limit: a parallel worker that hits the php.ini memory_limit
        # dies mid-run and leaves an incomplete analysis.
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Coverage gate (line coverage >= 80%)
        run: |
          # shellcheck disable=SC2016 # the single-quoted $ are PHP variables, not shell
          php -r '
            if (!is_file("coverage.xml")) { fwrite(STDERR, "coverage.xml missing\n"); exit(1); }
            $xml = simplexml_load_file("coverage.xml");
            if ($xml === false) { fwrite(STDERR, "could not parse coverage.xml\n"); exit(1); }
            $m = $xml->project->metrics ?? null;
            if ($m === null) { fwrite(STDERR, "no <project><metrics> in clover output\n"); exit(1); }
            $statements = (int) $m["statements"];
            $covered = (int) $m["coveredstatements"];
            if ($statements === 0) { echo "no statements measured\n"; exit(0); }
            $pct = ($covered / $statements) * 100;
            printf("Line coverage: %.2f%% (%d / %d statements)\n", $pct, $covered, $statements);
            if ($pct < 80.0) {
              fwrite(STDERR, sprintf("::error::coverage %.2f%% below 80%% gate\n", $pct));
              exit(1);
            }
          '

      - name: PHP-CS-Fixer (PER-CS dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Upload coverage artifact
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-php-${{ matrix.php }}
          path: coverage.xml
          if-no-files-found: warn

  # --- Lint gates ---
  # MIT license + no-vendor-SDK + no-lifecycle-scripts.
  # Runs once on the lowest-supported PHP (8.2) — these gates are PHP-version-independent.
  lint-gates:
    name: lint gates (license · no-sdk · no-lifecycle-scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify MIT license
        run: |
          # shellcheck disable=SC2016 # the single-quoted $ are PHP variables, not shell
          php -r '
            $p = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($p["license"] ?? null) !== "MIT") {
              fwrite(STDERR, "composer.json license must be MIT, got: " . json_encode($p["license"] ?? null) . "\n");
              exit(1);
            }
            echo "OK — MIT license.\n";
          '

      - name: Verify no vendor SDKs in require
        run: |
          # shellcheck disable=SC2016 # the single-quoted $ are PHP variables, not shell
          php -r '
            $p = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $require = $p["require"] ?? [];
            $forbidden = ["twilio/sdk", "sendgrid/sendgrid-php", "mailgun/mailgun-php", "aws/aws-sdk-php", "vonage/client", "messagebird/php-rest-api"];
            $found = [];
            foreach (array_keys($require) as $pkg) {
              foreach ($forbidden as $bad) {
                if (stripos($pkg, $bad) !== false) { $found[] = $pkg; }
              }
            }
            if ($found) {
              fwrite(STDERR, "Forbidden vendor SDKs in require: " . implode(", ", $found) . "\n");
              exit(1);
            }
            echo "OK — no vendor SDKs in require.\n";
          '

      - name: No-lifecycle-scripts gate
        run: |
          # shellcheck disable=SC2016 # the single-quoted $ are PHP variables, not shell
          php -r '
            $p = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $scripts = $p["scripts"] ?? [];
            $forbidden = [];
            foreach (array_keys($scripts) as $key) {
              if (preg_match("/^(pre|post)-(install|update|autoload-dump|package-install|package-update|package-uninstall|archive)/", $key)) {
                $forbidden[] = $key;
              }
            }
            if ($forbidden) {
              fwrite(STDERR, "Forbidden composer lifecycle scripts: " . implode(", ", $forbidden) . "\n");
              exit(1);
            }
            echo "OK — no composer lifecycle scripts.\n";
          '

      - name: Composer security audit
        # Blocking: a runtime dependency with a published advisory fails CI.
        run: composer audit --no-dev --format=plain

  # --- Import-time smoke (no network) ---
  # Confirms that loading the library and constructing a facade makes ZERO HTTP calls.
  # The construction runs inside a network NAMESPACE (`unshare -n`): no interface
  # except an isolated loopback exists, so no egress is possible at any privilege
  # level — a hard guarantee on top of the throwing PSR-18 stub. The Actions runner
  # agent lives OUTSIDE the namespace and keeps streaming logs. Do NOT swap this
  # for host-wide firewall rules (iptables): they also kill the runner agent
  # itself (same non-root `runner` user) and the job hangs until GitHub declares
  # the runner lost.
  import-smoke:
    name: import-time smoke (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Construct facade without network
        run: |
          sudo env "PATH=$PATH" unshare -n php -r '
            require __DIR__ . "/vendor/autoload.php";
            $stub = new class implements Psr\Http\Client\ClientInterface {
              public function sendRequest(Psr\Http\Message\RequestInterface $r): Psr\Http\Message\ResponseInterface {
                throw new RuntimeException("Unexpected import-time HTTP: " . $r->getMethod() . " " . (string) $r->getUri());
              }
            };
            $cfg = new Thinwrap\Notifications\Providers\Sendgrid\SendgridConfig(apiKey: "k", from: "noreply@example.com");
            $email = new Thinwrap\Notifications\Email(Thinwrap\Notifications\Enum\NotificationProviderId::Sendgrid, $cfg, $stub);
            if ($email->providerId !== Thinwrap\Notifications\Enum\NotificationProviderId::Sendgrid) {
              fwrite(STDERR, "expected providerId Sendgrid\n");
              exit(1);
            }
            echo "OK — autoload + construction made zero HTTP calls.\n";
          '

      - name: Prove the namespace actually blocks egress
        run: |
          if sudo unshare -n curl -s --max-time 5 https://packagist.org/ > /dev/null 2>&1; then
            echo "::error::Network namespace did not block egress — smoke gate is not actually offline."
            exit 1
          fi
          echo "OK — egress blocked inside the namespace."
