name: Publish to Packagist

# Packagist publish + cosign-signed GitHub Release artifact.
#
# Unlike npm OIDC trusted publishing, Packagist does NOT pull from a publish
# workflow. Packagist discovers new tags through its GitHub hook, which fires
# on the tag PUSH — so a pushed tag is indexed before, and regardless of, this
# job. The checks below therefore gate the cosign signature, not publication;
# keeping unreviewed tags off Packagist needs a tag ruleset on the repository.
#
# This workflow does NOT push to a package registry. Instead it:
#   1. Verifies the tag matches `v*` (the trigger is `release: published`).
#   2. Signs the release source archive via cosign keyless OIDC (no static
#      key) for attestable provenance — PHP analogue of npm Sigstore
#      provenance.
#   3. Attaches the cosign signature + certificate as Release assets so
#      consumers can run `cosign verify-blob` post-install.
#
# Trigger: `release: types: [published]` only. Branch protection does not
# cover tags and a Release can be cut from a tag on any commit, so the job
# refuses to sign unless the tagged commit is on `main`.
#
# `id-token: write` is required for the cosign keyless OIDC token exchange
# with sigstore. No PACKAGIST_TOKEN secret is consumed — long-lived Packagist
# API tokens are forbidden by policy (the webhook handles discovery instead).
#
# Two-factor authentication on the GitHub + Packagist maintainer accounts is a manual
# precondition — it cannot be enforced in YAML.

on:
  release:
    types: [published]

permissions:
  contents: write       # required to attach cosign signature as release asset
  id-token: write       # required for cosign keyless OIDC token exchange

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cosign-sign-and-attach:
    name: Cosign-sign release archive and attach to GitHub Release
    runs-on: ubuntu-latest
    env:
      # The tag name is user-controlled: scripts read it from the environment
      # rather than having it expanded inline, which would allow injection.
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0    # full history for the on-main ancestry check
          # Nothing here pushes with git (the upload uses GH_TOKEN), so the
          # token is not left in .git/config for later steps.
          persist-credentials: false

      - name: Verify tag matches v* pattern
        # Defence-in-depth: even though the workflow only triggers on
        # `release: published`, confirm the tag itself looks like a semver
        # release tag before signing. Prevents accidental signing of
        # `nightly-*` or `rc-*` tagged releases that should not ship to
        # Packagist.
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' does not match v<major>.<minor>.<patch>; refusing to sign."
            exit 1
          fi
          echo "Signing release for tag: $TAG"

      - name: Verify the tagged commit is on main
        # Tags bypass branch protection; without this, a tag on any commit
        # (for example on an unmerged branch) would be signed and released.
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main; refusing to sign."
            exit 1
          fi
          echo "Tagged commit $GITHUB_SHA is on main."

      - name: Download release source archive
        # GitHub auto-generates a `.tar.gz` source archive for every release
        # tag. We sign that archive (the same artifact consumers could download
        # from the Release page); Packagist itself fetches from the tag, not
        # from this archive, but consumers who want offline provenance
        # verification can grab archive + cosign.sig + cosign.pem from the
        # Release page and run cosign verify-blob.
        run: |
          # --fail: a 404/5xx HTML page must not be signed as the archive.
          curl --fail -sSL -o "source-${TAG}.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          ls -la "source-${TAG}.tar.gz"

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign keyless sign source archive
        # Keyless signing via GitHub Actions OIDC — no static private key
        # stored anywhere. The signing identity is recorded as the workflow
        # run + repo on the sigstore transparency log (Rekor); the signature
        # certificate's SAN encodes
        # `https://github.com/thinwrap/notifications-php/.github/workflows/release.yml@<sha>`.
        #
        # Verification recipe (consumer-side):
        #   cosign verify-blob \
        #     --certificate cosign.pem \
        #     --signature cosign.sig \
        #     --certificate-identity-regexp "https://github\.com/thinwrap/notifications-php/\.github/workflows/release\.yml@.+" \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     source-vX.Y.Z.tar.gz
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          archive="source-${TAG}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "cosign.sig" \
            --output-certificate "cosign.pem" \
            "$archive"
          ls -la cosign.sig cosign.pem

      - name: Upload cosign signature + certificate to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" cosign.sig cosign.pem --clobber

      - name: Print Packagist auto-discovery reminder
        # Packagist auto-discovers new tags via the GitHub-integration webhook
        # on the maintainer's Packagist account (configured pre-launch as a
        # one-time setup). This step prints a reminder so a release operator
        # knows to monitor Packagist post-tag.
        run: |
          cat <<EOF
          Cosign signature attached to release $TAG.

          Packagist auto-discovery should fire within minutes via the
          GitHub-integration webhook. To verify:
            composer show thinwrap/notifications | grep versions
            curl -sSL https://repo.packagist.org/p2/thinwrap/notifications.json | jq '.packages."thinwrap/notifications" | map(.version)'

          If Packagist does not pick up the tag within ~5 minutes, manually
          trigger an update via the Packagist UI ("Update" button on the
          package page) — this is a no-op once the webhook is correctly
          configured.
          EOF
